<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc">
  <title id="title">Sabrina Lin monogram</title>
  <desc id="desc">A champagne, cream, blush, and pearl monogram. This temporary graphic will be replaced by Sabrina's professional photo.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ead0"/><stop offset=".48" stop-color="#fffaf0"/><stop offset="1" stop-color="#eee3ed"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="750" fill="url(#paper)"/>
  <ellipse cx="230" cy="240" rx="300" ry="320" fill="url(#light)"/>
  <g fill="none" stroke="#b59a70" stroke-width="1" opacity=".65">
    <ellipse cx="300" cy="354" rx="169" ry="235" transform="rotate(24 300 354)"/>
    <ellipse cx="300" cy="354" rx="169" ry="235" transform="rotate(-24 300 354)"/>
  </g>
  <text x="300" y="394" text-anchor="middle" fill="#806745" font-family="Georgia,serif" font-size="116" letter-spacing="5">SL</text>
  <text x="300" y="628" text-anchor="middle" fill="#7d6b59" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">LEARNING WITH PURPOSE</text>
</svg>
